[package]
name = "eirn-kcp-v2"
version = "2.0.0"
edition = "2021"
authors = ["Naufal Ziyaadaturrahman"]
description = "Lattice-Native ZKPoK + KEM-Ratchet for Eirn-KCP"
license = "MIT"

[dependencies]
# SHA-3 / SHAKE
sha3 = "0.10"

# Constant-time operations
subtle = "2.5"

# Serialization
byteorder = "1.5"

# Random number generation
rand = "0.8"
rand_core = "0.6"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "zkp_bench"
harness = false
