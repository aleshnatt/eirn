[package]
name = "eirn-kcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Naufal Ziyaadaturrahman <naufal@aleshnatt.com>"]
description = "Protocol model for the Eirn-KCP asynchronous key exchange design"
documentation = "https://docs.rs/eirn-kcp"
homepage = "https://github.com/aleshnatt/eirn"
repository = "https://github.com/aleshnatt/eirn"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["protocol", "key-exchange", "kem", "prekey", "signature"]
categories = ["cryptography"]
exclude = [
    "paper/",
    "whitepaper/",
    ".github/",
    ".DS_Store",
    "scratch.rs",
    "Cargo.lock",
]

[dependencies]
ed25519-dalek = "2.1"
rand_core = { version = "0.6", features = ["getrandom"] }
sha3 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
rand = "0.8"
